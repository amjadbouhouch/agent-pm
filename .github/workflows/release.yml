name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  # Nothing is built or published until the suite passes: release.yml is the
  # only workflow that runs on the way to a user's machine.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual run builds the tag it publishes, not the default branch.
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Asset names must match what install.sh looks for:
        # apm-<os>-<arch> (tests/release_assets.rs checks this).
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: apm-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: apm-linux-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: apm-darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: apm-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: apm-windows-x64.exe
            ext: .exe
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual run builds the tag it publishes, not the default branch.
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build ${{ matrix.asset }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Checksum
        # install.sh fetches this and refuses to install on a mismatch.
        # Written as "<hash>  <name>" by hand: macOS has shasum, not sha256sum,
        # and Git Bash's sha256sum marks binary files with "*".
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/apm${{ matrix.ext }} dist/${{ matrix.asset }}
          cd dist
          if command -v sha256sum >/dev/null; then
            hash=$(sha256sum ${{ matrix.asset }} | cut -d' ' -f1)
          else
            hash=$(shasum -a 256 ${{ matrix.asset }} | cut -d' ' -f1)
          fi
          printf '%s  %s\n' "$hash" ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          cat ${{ matrix.asset }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256

  # One job creates the release, so the matrix jobs don't race to create it.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
