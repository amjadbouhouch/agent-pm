name: CI

# Releases are gated by the test job in release.yml, so this does not duplicate
# it on every push. It covers pull requests and manual runs.
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test

      - name: Verify the release build compiles
        run: cargo build --release --locked

      - name: Verify install.sh is valid POSIX sh
        if: runner.os != 'Windows'
        run: sh -n install.sh

      - name: Verify install.ps1 parses in Windows PowerShell and PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $check = '[void][ScriptBlock]::Create((Get-Content install.ps1 -Raw))'
          powershell -NoProfile -Command $check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Invoke-Expression $check
